syntax = "proto3";

import "phoenix/protobuf/decimal.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Tgs.GameInterface.Jili.Protos";

package GameInterfaceJili;

// The greeting service definition.
service GameInterfaceJili {
  // Sends a greeting
  rpc PlayerCreate (PlayerCreateRequest) returns (BaseReply);
  rpc PlayerBalance (PlayerBalanceRequest) returns (PlayerBalanceReply);
  rpc PlayerLogout (PlayerLogoutRequest) returns (BaseReply);
  rpc PlayerOnline (PlayerOnlineRequest) returns (PlayerOnlineReply);
  rpc FundIn (FundRequest) returns (FundReply);
  rpc FundOut (FundRequest) returns (FundReply);
  rpc FundStatus(FundStatusRequest) returns (BaseReply);
  rpc GameUrl (GameUrlRequest) returns (GameUrlReply);
  rpc GameRecord  (GameRecordRequest) returns (GameRecordReply);
  rpc GameRecordDetail (GameRecordDetailRequest) returns (GameRecordDetailReply);
  rpc CheckingService(CheckingServiceRequest) returns (CheckingServiceReply);
}

// The request message containing the user's name.
message FundRequest {
	string api_url = 1;
	string agent_id = 2;
	string agent_key = 3;
	string player_code = 4;
	string transaction_id = 5;
	phoenix.protobuf.DecimalValue amount = 6;
}

message FundStatusRequest {
	string api_url = 1;
	string agent_id = 2;
	string agent_key = 3;
	string transaction_id = 4;
}

message PlayerBalanceRequest {
	string api_url = 1;
	string agent_id = 2;
	string agent_key = 3;
	string player_code = 4;
}

message PlayerLogoutRequest {
	string api_url = 1;
	string agent_id = 2;
	string agent_key = 3;
	string player_code = 4;
}

message PlayerOnlineRequest {
	string api_url = 1;
	string agent_id = 2;
	string agent_key = 3;
	string player_code = 4;
}

message PlayerCreateRequest {
	string api_url = 1;
	string agent_id = 2;
	string agent_key = 3;
	string player_code = 4;
}

message GameUrlRequest {
	string api_url = 1;
	string agent_id = 2;
	string agent_key = 3;
	string player_code = 4;
	string external_game_id = 5;
	string language = 6;
}

message GameRecordRequest {
	string api_url = 1;
	string agent_id = 2;
	string agent_key = 3;
	google.protobuf.Timestamp start_time = 4; 
	google.protobuf.Timestamp end_time = 5;
	int32 page = 6;
	int32 page_limit = 7;
}

message GameRecordDetailRequest{
	string api_url = 1;
	string agent_id = 2;
	string agent_key = 3;
	string wagers_id = 4;
	string language = 5;
}

message CheckingServiceRequest{
    string machine_name = 1;
}

// The response message containing the greetings.
message BaseReply {
	bool state  = 1;
}

message FundReply {
	string transaction_id = 1;
	phoenix.protobuf.DecimalValue coin_before = 2;
	phoenix.protobuf.DecimalValue coin_after = 3;
	phoenix.protobuf.DecimalValue currency_before = 4;
	phoenix.protobuf.DecimalValue currency_after = 5;
	string resp = 6;
}

message PlayerBalanceReply {
	bool is_player_exist = 1;
	phoenix.protobuf.DecimalValue balance  = 2;
	bool online = 3;
}

message PlayerOnlineReply {
	bool online  = 1;
}


message GameUrlReply {
	bool is_player_exist = 1;
	string game_url = 2;
}

message GameRecordDetailReply{
	string url = 1;
}

message GameRecordReply {
	repeated GameRecordInfo items = 1;
}

message GameRecordInfo {
	string account = 1;
	string wagers_id = 2;
    int32 game_id = 3;
	google.protobuf.Timestamp wagers_time = 4;
	phoenix.protobuf.DecimalValue bet_amount = 5;
	google.protobuf.Timestamp payoff_time = 6;
	phoenix.protobuf.DecimalValue payoff_amount = 7;
	GameRecordStatus Status = 8;
	google.protobuf.Timestamp settlement_time = 9;
	int32 game_category_id = 10;
	int32 type = 11;
	string agent_id = 12;
	phoenix.protobuf.DecimalValue turnover = 13;
	string additional_data = 14;
}

enum GameRecordStatus {
  GAME_RECORD_STATUS_UNKNOWN = 0;
  GAME_RECORD_STATUS_WIN = 1;
  GAME_RECORD_STATUS_LOSE = 2;
}

message CheckingServiceReply{
    string machine_name = 1;
}